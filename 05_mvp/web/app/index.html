<style>
@font-face { font-family: "Noticia Text"; font-style: normal; font-weight: 700; font-display: swap; src: url("/assets/fonts/noticia-text-700-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Noticia Text"; font-style: normal; font-weight: 700; font-display: swap; src: url("/assets/fonts/noticia-text-700-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Vend Sans"; font-style: normal; font-weight: 300 700; font-display: swap; src: url("/assets/fonts/vend-sans-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Vend Sans"; font-style: normal; font-weight: 300 700; font-display: swap; src: url("/assets/fonts/vend-sans-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4, U+2C60-2C7F, U+A720-A7FF; }

:root {
  --route: #f2c94c;
  --route-deep: #d9a92a;
  --route-pill: #f7d75c;
  --ink: #144134;
  --ink-soft: #1b3525;
  --ink-muted: #4d6357;
  --button-green: #0f4535;
  --button-green-deep: #0a3327;
  --button-edge: #2d5e50;
  --field-edge: #4f6b5f;
  --ink-mist: #d5ded7;
  --ground: #f3f4ef;
  --ground-deep: #e9ebe3;
  --paper: #fbfbf7;
  --map-ground: #e4e3dc;
  --fast-gray: #9c9d97;
  --fast-pill: #e6e5df;
  --zone-violet: #7b3294;
  --error-brick: #8a2c1f;
  --line: rgba(20, 65, 52, 0.16);
  --line-strong: rgba(20, 65, 52, 0.32);
  --fs-caption: .82rem;
  --fs-small: .9rem;
  --fs-ui: .95rem;
  --fs-body: 1rem;
  --fs-lead: 1.06rem;
  --fs-title: 1.12rem;
  --fs-title-lg: 1.25rem;
  --fs-wordmark: 1.6rem;
  --fs-figure: 2rem;
  --fs-credit: .75rem;
  --fast-gray-deep: #6f706a;
  --serif: "Noticia Text", Georgia, serif;
  --sans: "Vend Sans", "Segoe UI", system-ui, sans-serif;
  --sheet-max: 64dvh;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 400 var(--fs-body)/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
::selection { background: var(--route-pill); color: var(--ink); }
:focus-visible { outline: 3px solid var(--route); outline-offset: 3px; border-radius: 4px; }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: var(--ink); caret-color: var(--ink); }

.app { display: grid; grid-template-columns: minmax(360px, 420px) 1fr; height: 100dvh; }
.panel {
  background: var(--ground);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--ink-mist) transparent;
  position: relative;
  z-index: 700;
}
.map-wrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--map-ground); }

.bar {
  display: flex; align-items: center; gap: 6px;
  padding: 12px 12px 8px 12px;
  position: sticky; top: 0; z-index: 2;
  background: var(--ground);
}
.bar-title { font: 500 var(--fs-body) var(--sans); margin-left: 2px; }
.wordmark { font: 700 var(--fs-wordmark)/1 var(--serif); letter-spacing: -0.01em; margin: 0 auto 0 8px; color: var(--ink); }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border: 0; border-radius: 6px; background: none; cursor: pointer; color: var(--ink);
  transition: background-color .16s ease-out;
}
.icon-btn:hover { background: var(--ground-deep); }
.icon-btn svg, .btn svg, .row svg, .opt svg, .seg svg { width: 20px; height: 20px; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.view { padding: 0 20px 28px; }
.view > :first-child { margin-top: 4px; }
h1.vh {
  font: 700 clamp(1.5rem, 1.25rem + 0.8vw, 1.85rem)/1.16 var(--serif);
  letter-spacing: -0.012em; margin: 8px 0 10px; text-wrap: balance;
}
h1.vh:focus { outline: none; }
h2.sh { font: 700 var(--fs-title)/1.25 var(--serif); margin: 28px 0 8px; }
.lead { font-weight: 300; font-size: var(--fs-lead); line-height: 1.55; color: var(--ink-soft); margin: 0 0 20px; max-width: 34em; }
.note { font-size: var(--fs-small); color: var(--ink-muted); margin: 8px 0 0; line-height: 1.45; }
.muted { color: var(--ink-muted); }
strong { font-weight: 600; }

.btn {
  height: 52px; padding: 0 20px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border-radius: 6px; border: 1px solid var(--button-edge);
  background: var(--button-green); color: var(--paper);
  font: 500 var(--fs-body) var(--sans); cursor: pointer; text-decoration: none;
  transition: background-color .16s ease-out, transform .12s ease-out;
}
.btn:hover { background: var(--button-green-deep); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.btn.block { width: 100%; }
.btn.secondary { background: var(--paper); color: var(--ink); border-color: var(--field-edge); }
.btn.secondary:hover { background: var(--ground-deep); }
.btn.small { height: 40px; padding: 0 14px; font-size: var(--fs-ui); }
.btn-row { display: flex; gap: 10px; margin-top: 20px; }
.btn-row > .btn { flex: 1; }
.stack { display: grid; gap: 10px; margin-top: 20px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: .25em; text-decoration-color: var(--route-deep); cursor: pointer; font-weight: 500; }

.search {
  display: flex; align-items: center; gap: 12px;
  width: 100%; height: 56px; padding: 0 16px;
  border: 1.5px solid var(--field-edge); border-radius: 6px;
  background: var(--paper); color: var(--ink-muted);
  font: 400 var(--fs-lead) var(--sans); text-align: left; cursor: text;
  transition: border-color .16s ease-out;
}
.search:hover { border-color: var(--ink); }
.search svg { width: 22px; height: 22px; color: var(--ink); }
.here { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: var(--fs-ui); color: var(--ink-muted); }
.here .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); flex: none; }

.list { list-style: none; margin: 0; padding: 0; }
.row {
  display: flex; align-items: center; gap: 14px;
  width: 100%; min-height: 60px; padding: 10px 6px;
  border: 0; border-bottom: 1px solid var(--line); background: none;
  text-align: left; cursor: pointer; color: var(--ink);
  transition: background-color .16s ease-out;
}
.row:hover { background: var(--ground-deep); }
a.row { text-decoration: none; }
.row.static { cursor: default; }
.row.static:hover { background: none; }
.row-ico { width: 38px; height: 38px; border-radius: 50%; background: var(--ground-deep); color: var(--ink); display: grid; place-items: center; flex: none; }
.row-ico.zone { color: var(--zone-violet); }
.row-txt { flex: 1; min-width: 0; }
.row-t { display: block; font-weight: 500; line-height: 1.3; }
.row-s { display: block; font-size: var(--fs-small); color: var(--ink-muted); line-height: 1.35; margin-top: 2px; }
.row-end { color: var(--ink-muted); flex: none; display: flex; align-items: center; }

.fields { border: 1.5px solid var(--field-edge); border-radius: 6px; background: var(--paper); display: grid; grid-template-columns: 1fr auto; }
.fields .f { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 56px; }
.fields .f + .f { border-top: 1px solid var(--line); }
.fields label { font-size: var(--fs-caption); font-weight: 500; color: var(--ink-muted); width: 44px; flex: none; }
.fields input { border: 0; background: none; height: 100%; flex: 1; min-width: 0; font-size: var(--fs-body); outline: none; }
.fields .f:focus-within { background: var(--ground); }
.fields .stops { grid-column: 1; }
.fields .swap { grid-column: 2; grid-row: 1; align-self: center; margin-right: 6px; }

.field { margin-top: 18px; }
.field > label, .legend { display: block; font-weight: 500; font-size: var(--fs-ui); margin-bottom: 8px; }
.input, textarea.input, select.input {
  width: 100%; min-height: 50px; padding: 12px 14px;
  border: 1.5px solid var(--field-edge); border-radius: 6px; background: var(--paper);
  transition: border-color .16s ease-out;
}
.input:hover { border-color: var(--ink); }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.45; }
.err { color: var(--error-brick); font-size: var(--fs-small); margin-top: 6px; }

.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.pill { display: inline-flex; align-items: center; height: 32px; padding: 0 13px; border-radius: 999px; font: 500 var(--fs-ui) var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.pill.route { background: var(--route-pill); }
.pill.fast { background: var(--fast-pill); }

.opt {
  display: block; width: 100%; text-align: left;
  padding: 14px 16px; margin-top: 10px;
  border: 1.5px solid var(--line-strong); border-radius: 8px; background: var(--paper);
  cursor: pointer; transition: border-color .16s ease-out;
}
.opt:hover { border-color: var(--field-edge); }
.opt[aria-checked="true"] { border-color: var(--ink); outline: 1.5px solid var(--ink); outline-offset: -3px; }
.opt[aria-checked="true"]:focus-visible { outline: 3px solid var(--route); outline-offset: 3px; }
.opt-head { display: flex; align-items: center; gap: 12px; }
.opt-name { font: 700 var(--fs-title) var(--serif); }
.opt-time { margin-left: auto; font-weight: 500; font-size: var(--fs-lead); white-space: nowrap; }
.opt-meta { font-size: var(--fs-small); color: var(--ink-muted); margin: 4px 0 0; }
.why { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: var(--fs-ui); line-height: 1.4; }
.why li { display: flex; gap: 8px; }
.why svg { width: 18px; height: 18px; margin-top: 1px; }
.why .ok { color: var(--ink); }
.why .warn { color: var(--ink); }
.why .warn svg { color: var(--zone-violet); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
p { text-wrap: pretty; }
.swatch-route { width: 30px; height: 8px; border-radius: 4px; background: var(--route); box-shadow: 0 0 0 1.5px var(--route-deep); flex: none; }
.swatch-fast { width: 30px; height: 0; border-top: 5px dotted var(--fast-gray); flex: none; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  min-height: 92px; padding: 14px; text-align: left;
  border: 1.5px solid var(--line-strong); border-radius: 8px; background: var(--paper); cursor: pointer;
  transition: border-color .16s ease-out, background-color .16s ease-out;
}
.tile:hover { border-color: var(--field-edge); }
.tile[aria-checked="true"] { border-color: var(--ink); background: var(--ground-deep); outline: 1.5px solid var(--ink); outline-offset: -3px; }
.tile svg { width: 24px; height: 24px; }
.tile span { font-weight: 500; line-height: 1.25; }
.seg { display: flex; border: 1.5px solid var(--field-edge); border-radius: 6px; overflow: hidden; background: var(--paper); }
.seg button { flex: 1; height: 46px; border: 0; background: none; cursor: pointer; font-weight: 500; font-size: var(--fs-ui); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"] { background: var(--button-green); color: var(--paper); }
.where { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--line-strong); border-radius: 6px; background: var(--paper); }
.where .row-txt { font-weight: 500; }

.switch { width: 48px; height: 28px; border-radius: 999px; border: 1.5px solid var(--field-edge); background: var(--ground-deep); position: relative; flex: none; transition: background-color .16s ease-out; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--field-edge); transition: transform .18s cubic-bezier(.16, 1, .3, 1); }
[aria-checked="true"] > .switch, [aria-checked="true"] .switch { background: var(--button-green); border-color: var(--button-green); }
[aria-checked="true"] .switch::after { transform: translateX(20px); border-color: var(--button-green); }

.ad { font-size: var(--fs-caption); font-weight: 500; color: var(--ink-muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 8px; margin-left: 6px; white-space: nowrap; }

details.tech { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 6px; }
details.tech summary { cursor: pointer; font-weight: 500; padding: 10px 0; }
.code { font: 400 var(--fs-caption)/1.5 "Cascadia Mono", Consolas, ui-monospace, monospace; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; white-space: pre; margin: 6px 0 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--fs-ui); margin: 6px 0 12px; }
table.t th, table.t td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
table.t th { font-weight: 500; color: var(--ink-muted); }
table.t td:not(:first-child), table.t th:not(:first-child) { text-align: right; }

.nav-stats { display: flex; align-items: baseline; gap: 12px; margin-top: 6px; }
.nav-min { font: 700 var(--fs-figure)/1 var(--serif); }
.nav-sub { color: var(--ink-muted); }
.nav-to { margin: 6px 0 0; color: var(--ink-soft); font: 400 var(--fs-body)/1.5 var(--sans); }
.nav-to:focus { outline: none; }
.notice { display: flex; gap: 12px; align-items: center; margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--paper); }
.notice .row-txt { font-size: var(--fs-ui); }
.nav-actions { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; margin-top: 18px; }

.map-tag { position: absolute; z-index: 600; top: 12px; left: 12px; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; font: 500 var(--fs-caption) var(--sans); color: var(--ink); pointer-events: none; }
.nav-banner {
  position: absolute; z-index: 650; top: 12px; left: 12px; right: 12px; max-width: 520px;
  display: flex; align-items: center; gap: 14px;
  background: var(--ink); color: var(--paper); border-radius: 8px; padding: 14px 16px;
}
.nav-banner svg { width: 34px; height: 34px; color: var(--route); }
.nav-banner .nb-t { font: 700 var(--fs-title-lg)/1.2 var(--serif); }
.nav-banner .nb-d { color: var(--ink-mist); font-size: var(--fs-ui); margin-top: 2px; }
.pick-pin { position: absolute; z-index: 640; left: 50%; top: 50%; transform: translate(-50%, -100%); pointer-events: none; color: var(--ink); }
.pick-pin svg { width: 40px; height: 40px; fill: var(--paper); stroke: var(--ink); stroke-width: 1.75; }
.pick-bar {
  position: absolute; z-index: 660; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom));
  max-width: 520px; margin: 0 auto;
  background: var(--paper); border: 1px solid var(--line-strong); border-radius: 8px; padding: 14px 16px;
}
.pick-bar .pb-t { font-weight: 500; }
.pick-bar .pb-s { font-size: var(--fs-small); color: var(--ink-muted); margin-top: 2px; }
.pick-bar .btn-row { margin-top: 12px; }
[hidden] { display: none !important; }

.m-me { width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 4px solid var(--ink); }
.m-a { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); border: 4px solid var(--route); }
.m-b { width: 26px; height: 26px; border-radius: 50%; background: var(--route); border: 4px solid var(--ink); }
.m-pin { width: 22px; height: 22px; border-radius: 50%; background: var(--paper); border: 4px solid var(--zone-violet); }
.m-biz { width: 30px; height: 30px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--ink); color: var(--ink); display: grid; place-items: center; }
.m-biz svg { width: 16px; height: 16px; }
.m-biz.far { opacity: .55; }

.leaflet-container { font-family: var(--sans); background: var(--map-ground); }
.leaflet-tile-pane { filter: saturate(.28) sepia(.12) contrast(.92) brightness(1.04); }
.leaflet-touch .leaflet-bar, .leaflet-bar { border: 1px solid var(--line-strong) !important; box-shadow: none !important; border-radius: 6px; }
.leaflet-bar a { color: var(--ink); background: var(--paper); width: 40px !important; height: 40px !important; line-height: 40px !important; }
.leaflet-marker-icon:focus-visible { outline: 3px solid var(--route); outline-offset: 2px; border-radius: 50%; }
.leaflet-bar a:hover { background: var(--ground-deep); }
.leaflet-control-attribution { background: rgba(251, 251, 247, .9) !important; font-size: var(--fs-credit); padding: 3px 8px !important; }
.leaflet-control-attribution a { color: var(--ink-muted); }
.leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: none; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); }
.leaflet-popup-tip { box-shadow: none; border: 1px solid var(--line-strong); background: var(--paper); }
.leaflet-popup-content { margin: 14px 16px; font: 400 var(--fs-ui)/1.45 var(--sans); }
.pop-t { font: 700 var(--fs-body)/1.25 var(--serif); display: block; margin-bottom: 4px; }
.pop-actions { display: flex; gap: 8px; margin-top: 10px; }

.toasts { position: fixed; z-index: 900; left: 50%; transform: translateX(-50%); bottom: 24px; width: min(92vw, 440px); display: grid; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 12px 14px 12px 16px; animation: toast-in .28s cubic-bezier(.16, 1, .3, 1); }
.toast span { flex: 1; }
.toast button { border: 0; background: none; color: var(--paper); font-weight: 600; text-decoration: underline; text-underline-offset: .25em; cursor: pointer; padding: 6px; min-height: 44px; }
.toast .toast-close { width: 44px; display: grid; place-items: center; text-decoration: none; }
.toast .toast-close svg { width: 18px; height: 18px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

dialog { border: 1px solid var(--line-strong); border-radius: 8px; padding: 22px; width: min(92vw, 380px); background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgba(20, 65, 52, .38); }
dialog h2 { font: 700 var(--fs-title-lg)/1.2 var(--serif); margin: 0 0 8px; }
dialog p { margin: 0; color: var(--ink-soft); }

@media (max-width: 899px) {
  .app { display: block; }
  .map-wrap { position: fixed; inset: 0; }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-height: var(--sheet-max);
    border-right: 0; border-top: 1px solid var(--line-strong);
    border-radius: 8px 8px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bar { border-radius: 8px 8px 0 0; padding-top: 10px; }
  body.picking .panel { display: none; }
  body.walking { --sheet-max: 46dvh; }
  body.walking .map-tag { display: none; }
  .nav-banner { top: 28px; }
  .toasts { top: 12px; bottom: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <main class="panel" id="panel"></main>
  <section class="map-wrap" aria-label="Mapa">
    <div id="map"></div>
    <span class="map-tag" id="map-tag">Datos de ejemplo · Col. Cuauhtémoc</span>

function storeGet(key, fallback) {

  return fallback;
}

}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = Math.PI / 180;
  const dLat = (lat2 - lat1) * toRad;
  const dLon = (lon2 - lon1) * toRad;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function pointToRoute(lat, lng, coords) {
  if (!coords || coords.length < 2) return { distance: Infinity, progress: 0 };
  const mLat = 110540;
  const mLng = 111320 * Math.cos(lat * Math.PI / 180);
  let best = Infinity;
  let bestProgress = 0;
  let cumulative = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const ax = (coords[i][1] - lng) * mLng;
    const ay = (coords[i][0] - lat) * mLat;
    const bx = (coords[i + 1][1] - lng) * mLng;
    const by = (coords[i + 1][0] - lat) * mLat;
    const dx = bx - ax;
    const dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    let t = 0;
    if (lenSq > 1e-9) t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / lenSq));
    const qx = ax + t * dx;
    const qy = ay + t * dy;
    const d = Math.sqrt(qx * qx + qy * qy);
    if (d < best) {
      best = d;
      bestProgress = cumulative + t * Math.sqrt(lenSq);
    }
    cumulative += Math.sqrt(lenSq);
  }
  return { distance: Math.round(best), progress: bestProgress };
}

function insideArea(lat, lng) {
  const poly = AREA.boundary;
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const yi = poly[i][0], xi = poly[i][1], yj = poly[j][0], xj = poly[j][1];
    const crosses = (yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi;
    if (crosses) inside = !inside;
  }
  return inside;
}

function buildGraph() {
  const nodes = new Map();
  const adj = new Map();
  for (const raw of RAW_NODES) {
    nodes.set(raw[0], { id: raw[0], lat: raw[1], lng: raw[2], name: raw[3] });
    adj.set(raw[0], []);
  }
  for (const e of RAW_EDGES) {
    const u = nodes.get(e[0]);
    const v = nodes.get(e[1]);
    const dist = haversineMeters(u.lat, u.lng, v.lat, v.lng);
    adj.get(e[0]).push({ to: e[1], dist: dist, street: e[2], isMain: e[3] });
    adj.get(e[1]).push({ to: e[0], dist: dist, street: e[2], isMain: e[3] });
  }
  return { nodes: nodes, adj: adj };
}

class MinHeap {
  constructor() { this.heap = []; }
  size() { return this.heap.length; }
  push(item) {
    const h = this.heap;
    h.push(item);
    let i = h.length - 1;
    while (i > 0) {
      const p = Math.floor((i - 1) / 2);
      if (h[i].f >= h[p].f) break;
      const tmp = h[i]; h[i] = h[p]; h[p] = tmp;
      i = p;
    }
  }
  pop() {
    const h = this.heap;
    if (h.length === 0) return null;
    const top = h[0];
    const last = h.pop();
    if (h.length > 0) {
      h[0] = last;
      let i = 0;
      while (true) {
        const l = 2 * i + 1;
        const r = 2 * i + 2;
        let m = i;
        if (l < h.length && h[l].f < h[m].f) m = l;
        if (r < h.length && h[r].f < h[m].f) m = r;
        if (m === i) break;
        const tmp = h[i]; h[i] = h[m]; h[m] = tmp;
        i = m;
      }
    }
    return top;
  }
}

const graph = buildGraph();
let zones = [];

function riskField(lat, lng) {
  let phi = 0;
  for (const z of zones) {
    const d = haversineMeters(lat, lng, z.lat, z.lng);
    const reach = z.radius * 1.35;
    if (d <= reach) {
      const severity = z.level === 'high' ? 2.8 : 1.5;
      const k = 1 - d / reach;
      phi += severity * k * k;
    }
  }
  return phi;
}

function safeField(lat, lng) {
  let bonus = 0;
  for (const s of SAFE_SPOTS) {
    const d = haversineMeters(lat, lng, s.lat, s.lng);
    if (d <= 135) bonus += 0.55 * (1 - d / 135);
  }
  return Math.min(bonus, 1.4);
}

function lineOfSightRisk(latN, lngN, latB, lngB) {
  const local = riskField(latN, lngN);
  let ray = 0;
  for (const t of [0.25, 0.5, 0.75]) {
    ray += riskField(latN + (latB - latN) * t, lngN + (lngB - lngN) * t);
  }
  return local * 0.65 + (ray / 3) * 0.35;
}

function nearestNode(lat, lng) {
  let bestId = null;
  let bestDist = Infinity;
  for (const node of graph.nodes.values()) {
    const d = haversineMeters(lat, lng, node.lat, node.lng);
    if (d < bestDist) {
      bestDist = d;
      bestId = node.id;
    }
  }
  return { id: bestId, dist: bestDist };
}

const ALPHA = 1.35;
const BETA = 32.0;
const V_MAX = 1.55;
const GAMMA = 0.14;

function runAStar(mode, from, to) {
  const t0 = performance.now();
  const start = nearestNode(from.lat, from.lng);
  const goal = nearestNode(to.lat, to.lng);
  const goalNode = graph.nodes.get(goal.id);

  function heuristic(node) {
    const d = haversineMeters(node.lat, node.lng, goalNode.lat, goalNode.lng);
    if (mode === 'safe') {
      const phi = lineOfSightRisk(node.lat, node.lng, goalNode.lat, goalNode.lng);
      return Math.max(0, d * (1 + ALPHA * phi) - BETA * safeField(node.lat, node.lng));
    }
    return (d / V_MAX) * (1 + GAMMA * riskField(node.lat, node.lng));
  }

  const open = new MinHeap();
  const gScore = new Map();
  const cameFrom = new Map();
  const closed = new Set();
  const explored = [];
  gScore.set(start.id, 0);
  open.push({ id: start.id, g: 0, f: heuristic(graph.nodes.get(start.id)) });
  let found = false;

  while (open.size() > 0) {
    const cur = open.pop();
    if (closed.has(cur.id)) continue;
    closed.add(cur.id);
    const curNode = graph.nodes.get(cur.id);
    explored.push([curNode.lat, curNode.lng]);
    if (cur.id === goal.id) {
      found = true;
      break;
    }
    for (const edge of graph.adj.get(cur.id)) {
      if (closed.has(edge.to)) continue;
      const next = graph.nodes.get(edge.to);
      const midLat = (curNode.lat + next.lat) / 2;
      const midLng = (curNode.lng + next.lng) / 2;
      const edgePhi = (riskField(curNode.lat, curNode.lng) + 2 * riskField(midLat, midLng) + riskField(next.lat, next.lng)) / 4;
      let cost;
      if (mode === 'safe') {
        const mainDiscount = edge.isMain ? 0.88 : 1.0;
        cost = edge.dist * Math.max(0.55, (1 + 5.2 * edgePhi - 0.30 * safeField(midLat, midLng)) * mainDiscount);
      } else {
        const speed = edge.isMain ? 1.55 : 1.22;
        cost = (edge.dist / speed) * (1 + 0.25 * edgePhi);
      }
      const g = cur.g + cost;
      if (!gScore.has(edge.to) || g < gScore.get(edge.to)) {
        gScore.set(edge.to, g);
        cameFrom.set(edge.to, { from: cur.id, street: edge.street, dist: edge.dist });
        open.push({ id: edge.to, g: g, f: g + heuristic(next) });
      }
    }
  }

  const computeMs = performance.now() - t0;
  if (!found) return null;

  const coords = [];
  const segStreets = [];
  let distM = 0;
  let id = goal.id;
  while (id) {
    const n = graph.nodes.get(id);
    coords.unshift([n.lat, n.lng]);
    const prev = cameFrom.get(id);
    if (prev) {
      segStreets.unshift(prev.street);
      distM += prev.dist;
      id = prev.from;
    } else {
      id = null;
    }
  }
  if (start.dist > 6) {
    coords.unshift([from.lat, from.lng]);
    segStreets.unshift(segStreets.length ? segStreets[0] : 'la calle');
    distM += start.dist;
  }
  if (goal.dist > 6) {
    coords.push([to.lat, to.lng]);
    segStreets.push(segStreets.length ? segStreets[segStreets.length - 1] : 'la calle');
    distM += goal.dist;
  }

  const risks = [];
  for (const z of zones) {
    if (pointToRoute(z.lat, z.lng, coords).distance <= z.radius) risks.push(z);
  }
  const safe = [];
  for (const s of SAFE_SPOTS) {
    if (pointToRoute(s.lat, s.lng, coords).distance <= 125) safe.push(s);
  }
  const streets = [];
  for (const s of segStreets) {
    if (streets.indexOf(s) === -1) streets.push(s);
  }

  return {
    mode: mode,
    coords: coords,
    segStreets: segStreets,
    distM: distM,
    min: Math.max(1, Math.round(distM / WALK_M_PER_MIN)),
    risks: risks,
    safe: safe,
    streets: streets,
    explored: explored,
    computeMs: computeMs
  };
}

function sameCoords(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i][0] !== b[i][0] || a[i][1] !== b[i][1]) return false;
  }
  return true;
}

function computeTrip(from, to) {
  if (!insideArea(from.lat, from.lng) && nearestNode(from.lat, from.lng).dist > OUT_OF_AREA_M) return { error: 'fuera' };
  if (!insideArea(to.lat, to.lng) && nearestNode(to.lat, to.lng).dist > OUT_OF_AREA_M) return { error: 'fuera' };
  if (nearestNode(from.lat, from.lng).id === nearestNode(to.lat, to.lng).id) return { error: 'cerca' };
  const safe = runAStar('safe', from, to);
  const fast = runAStar('fast', from, to);
  if (!safe || !fast) return { error: 'sin-ruta' };
  const same = sameCoords(safe.coords, fast.coords) || fast.distM >= safe.distM;
  return { safe: safe, fast: same ? safe : fast, same: same };
}

function prettyName(name) {
  return name.replace(' & ', ' y ').replace('Calz. ', 'Calzada ').replace('Av. ', 'Avenida ');
}

function nameAt(lat, lng) {
  const near = nearestNode(lat, lng);
  const base = prettyName(graph.nodes.get(near.id).name);
  if (near.dist > 45) return 'Cerca de ' + base;
  return base;
}

function atPlace(name) {
  if (name.indexOf('Cerca de ') === 0) return 'cerca de ' + name.slice(9);
  return 'en ' + name;
}

function categoryOf(id) {
  for (const c of BIZ_CATEGORIES) if (c.id === id) return c;
  return BIZ_CATEGORIES[0];
}

function tierOf(id) {
  for (const t of BIZ_TIERS) if (t.id === id) return t;
  return BIZ_TIERS[1];
}

function reportTypeOf(id) {
  for (const t of REPORT_TYPES) if (t.id === id) return t;
  return REPORT_TYPES[REPORT_TYPES.length - 1];
}

function whenLabel(id) {
  for (const w of REPORT_WHEN) if (w.id === id) return w.label;
  return '';
}

function formatDist(m) {
  if (m < 1000) return Math.max(10, Math.round(m / 10) * 10) + ' m';
  return (m / 1000).toFixed(1) + ' km';
}

function clockIn(min) {
  return new Date(Date.now() + min * 60000).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}

function dateLabel(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}

function normalize(text) {
  return text.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

let reports = storeGet('goia.reports', []);
let businesses = storeGet('goia.businesses', null) || SAMPLE_BUSINESSES.map(function (b) { return Object.assign({}, b); });
let recents = storeGet('goia.recents', []);

const state = {
  plan: { from: USER_LOCATION, to: null, active: 'to', query: '' },
  choice: 'safe',
  trip: null,
  nav: null,
  lastTrip: null,
  report: null,
  lastReport: null,
  bizDraft: null,
  tech: storeGet('goia.tech', false),
  showExplored: false,
  pick: null,
  stack: []
};

function rebuildZones() {
  zones = [];
  for (const z of SAMPLE_ZONES) zones.push(Object.assign({ sample: true }, z));
  for (const r of reports) {
    const type = reportTypeOf(r.type);
    zones.push({ id: r.id, lat: r.lat, lng: r.lng, radius: REPORT_RADIUS_M, level: type.level, title: type.label, place: r.place, createdAt: r.createdAt, sample: false });
  }
}

function buildPlaces() {
  const places = [];
  for (const l of LANDMARKS) {
    const n = graph.nodes.get(l.node);
    places.push({ id: 'l:' + l.name, name: l.name, sub: 'Colonia Cuauhtémoc', lat: n.lat, lng: n.lng, kind: 'landmark' });
  }
  for (const b of businesses) {
    places.push({ id: 'b:' + b.id, name: b.name, sub: categoryOf(b.category).label + ' · ' + nameAt(b.lat, b.lng), lat: b.lat, lng: b.lng, kind: 'shop', icon: categoryOf(b.category).icon });
  }
  for (const n of graph.nodes.values()) {
    places.push({ id: 'n:' + n.id, name: prettyName(n.name), sub: 'Esquina · Colonia Cuauhtémoc', lat: n.lat, lng: n.lng, kind: 'corner' });
  }
  return places;
}

function searchPlaces(query) {
  const tokens = normalize(query).split(/\s+/).filter(function (t) { return t.length > 0; });
  const found = [];
  for (const p of buildPlaces()) {
    const hay = normalize(p.name + ' ' + p.sub);
    let ok = true;
    for (const t of tokens) {
      if (hay.indexOf(t) === -1) ok = false;
    }
    if (ok) found.push(p);
    if (found.length >= 8) break;
  }
  return found;
}

function placeIcon(p) {
  if (p.kind === 'me') return 'locate';
  if (p.kind === 'shop') return p.icon || 'store';
  if (p.kind === 'recent') return 'clock';
  if (p.kind === 'point') return 'pin';
  if (p.kind === 'corner') return 'pin';
  return 'flag';
}

function addRecent(place) {
  if (place.kind === 'me') return;
  const kept = [];
  for (const r of recents) if (r.name !== place.name) kept.push(r);
  kept.unshift({ id: place.id, name: place.name, sub: place.sub, lat: place.lat, lng: place.lng, kind: place.kind, icon: place.icon });
  recents = kept.slice(0, 4);
  storeSet('goia.recents', recents);
}

function matchedBusinesses(coords) {
  const list = [];
  for (const b of businesses) {
    const tier = tierOf(b.tier);
    const prox = pointToRoute(b.lat, b.lng, coords);
    if (prox.distance <= tier.radius) list.push({ biz: b, distance: prox.distance, progress: prox.progress });
  }
  list.sort(function (a, b) { return a.progress - b.progress; });
  return list;
}

function describeRoute(route) {
  const lines = [];
  if (route.risks.length === 0) {
    lines.push({ ok: true, text: 'Evita las zonas con reportes.' });
  } else {
    const names = [];
    for (const r of route.risks) {
      const name = r.place || r.title;
      if (names.indexOf(name.replace('Cerca de ', '')) === -1) names.push(name.replace('Cerca de ', ''));
    }
    const label = route.risks.length === 1 ? 'una zona' : route.risks.length + ' zonas';
    lines.push({ ok: false, text: 'Pasa cerca de ' + label + ' con reportes: ' + names.join(', ') + '.' });
  }
  if (route.safe.length > 0) {
    const label = route.safe.length === 1 ? 'un punto' : route.safe.length + ' puntos';
    lines.push({ ok: true, text: 'Pasa junto a ' + label + ' con vigilancia o comercio abierto.' });
  }
  return lines;
}

function tripSummary(trip) {
  if (trip.same) return 'Aquí el camino más rápido es también el de menor riesgo estimado.';
  const extra = trip.safe.min - trip.fast.min;
  const avoided = trip.fast.risks.length - trip.safe.risks.length;
  let text = extra <= 0 ? 'La ruta GoIA tarda lo mismo' : 'La ruta GoIA tarda ' + extra + ' min más';
  if (avoided > 0) {
    text += ' y evita ' + (avoided === 1 ? 'una zona' : avoided + ' zonas') + ' con reportes.';
  } else if (trip.safe.safe.length > trip.fast.safe.length) {
    text += ' y pasa junto a más puntos con vigilancia.';
  } else {
    text += ' y va por calles con menos riesgo estimado.';
  }
  return text;
}

let map;
const COLORS = {};

function readColors() {
  const css = getComputedStyle(document.documentElement);
  COLORS.ink = css.getPropertyValue('--ink').trim();
  COLORS.zone = css.getPropertyValue('--zone-violet').trim();
  COLORS.route = css.getPropertyValue('--route').trim();
  COLORS.routeDeep = css.getPropertyValue('--route-deep').trim();
  COLORS.paper = css.getPropertyValue('--paper').trim();
  COLORS.fast = css.getPropertyValue('--fast-gray').trim();
  COLORS.fastDeep = css.getPropertyValue('--fast-gray-deep').trim();
}
const layers = {};
let userMarker = null;
let walkerMarker = null;

function divIcon(cls, size, html) {
  return L.divIcon({ className: '', html: '<div class="' + cls + '">' + (html || '') + '</div>', iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
}

function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: true, minZoom: 14, maxZoom: 19 }).setView(AREA.center, AREA.zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  map.attributionControl.setPrefix(false);
  map.attributionControl.setPosition(isMobile() ? 'topright' : 'bottomright');
  if (!isMobile()) L.control.zoom({ position: 'bottomright', zoomInTitle: 'Acercar', zoomOutTitle: 'Alejar' }).addTo(map);

  L.polygon(AREA.boundary, { color: COLORS.ink, weight: 1.5, opacity: 0.35, dashArray: '2 6', fill: false, interactive: false }).addTo(map);
  layers.zones = L.layerGroup().addTo(map);
  layers.tech = L.layerGroup().addTo(map);
  layers.routes = L.layerGroup().addTo(map);
  layers.biz = L.layerGroup().addTo(map);
  layers.marks = L.layerGroup().addTo(map);
  userMarker = L.marker([USER_LOCATION.lat, USER_LOCATION.lng], { icon: divIcon('m-me', 20), keyboard: false, title: 'Tu ubicación' });

  map.on('click', onMapClick);
  map.on('move', updatePickLabel);
}

function isMobile() {
  return window.matchMedia('(max-width: 899px)').matches;
}

function fitTo(latlngs) {
  if (!latlngs.length) return;
  const bounds = L.latLngBounds(latlngs);
  const panel = document.getElementById('panel');
  if (isMobile()) {
    map.fitBounds(bounds, { paddingTopLeft: [28, 70], paddingBottomRight: [28, panel.offsetHeight + 28], maxZoom: 17 });
  } else {
    map.fitBounds(bounds, { padding: [56, 56], maxZoom: 17 });
  }
}

function centerOn(latlng, zoom) {
  map.setView(latlng, zoom, { animate: false });
  if (isMobile()) map.panBy([0, document.getElementById('panel').offsetHeight / 2], { animate: false });
}

function keepVisible(pos) {
  const pt = map.latLngToContainerPoint(pos);
  const size = map.getSize();
  const bottom = isMobile() ? size.y - document.getElementById('panel').offsetHeight : size.y;
  if (pt.x < 50 || pt.x > size.x - 50 || pt.y < 110 || pt.y > bottom - 50) centerOn(pos, map.getZoom());
}

function drawZones() {
  layers.zones.clearLayers();
  for (const z of zones) {
    const circle = L.circle([z.lat, z.lng], {
      radius: z.radius,
      color: COLORS.zone,
      weight: 2.5,
      opacity: 0.9,
      dashArray: '6 4',
      fillColor: COLORS.zone,
      fillOpacity: z.level === 'high' ? 0.28 : 0.18,
      bubblingMouseEvents: false
    });
    let body = '<span class="pop-t">' + esc(z.sample ? z.title : z.title + ' · ' + (z.place || '')) + '</span>';
    if (z.description) body += esc(z.description) + '<br>';
    body += '<span class="muted">' + (z.sample ? 'Reporte de ejemplo' : 'Tu reporte · ' + esc(dateLabel(z.createdAt))) + '</span>';
    circle.bindPopup(body);
    circle.addTo(layers.zones);
  }
}

function drawRoute(route, kind, strong) {
  const opts = { bubblingMouseEvents: false, lineCap: 'round', lineJoin: 'round' };
  let lines = [];
  if (kind === 'safe') {
    lines.push(L.polyline(route.coords, Object.assign({}, opts, { color: COLORS.routeDeep, weight: strong ? 12 : 9, opacity: strong ? 1 : 0.7 })));
    lines.push(L.polyline(route.coords, Object.assign({}, opts, { color: COLORS.route, weight: strong ? 7 : 5, opacity: strong ? 1 : 0.8 })));
  } else {
    lines.push(L.polyline(route.coords, Object.assign({}, opts, { color: COLORS.paper, weight: strong ? 10 : 8, opacity: 0.9 })));
    lines.push(L.polyline(route.coords, Object.assign({}, opts, { color: strong ? COLORS.fastDeep : COLORS.fast, weight: strong ? 6 : 5, dashArray: '0.1 11' })));
  }
  for (const line of lines) {
    if (currentView() === 'rutas') {
      line.on('click', function () { selectRoute(kind); });
    }
    line.addTo(layers.routes);
  }
}

function drawEndpoints(from, to) {
  if (from && from.kind !== 'me') L.marker([from.lat, from.lng], { icon: divIcon('m-a', 22), keyboard: false, title: 'Salida' }).addTo(layers.marks);
  if (to) L.marker([to.lat, to.lng], { icon: divIcon('m-b', 26), keyboard: false, title: 'Destino' }).addTo(layers.marks);
}

function drawBusinesses(list, showAll) {
  layers.biz.clearLayers();
  const shown = showAll ? businesses.map(function (b) { return { biz: b }; }) : list;
  for (const item of shown) {
    const b = item.biz;
    const cat = categoryOf(b.category);
    const m = L.marker([b.lat, b.lng], { icon: divIcon('m-biz', 30, icon(cat.icon)), title: b.name + ', ' + cat.label, keyboard: true, bubblingMouseEvents: false });
    m.bindPopup('<span class="pop-t">' + esc(b.name) + '</span>' + esc(b.promo) + '<br><span class="muted">' + esc(cat.label) + ' · Patrocinado</span>');
    m.addTo(layers.biz);
    if (showAll) {
      L.circle([b.lat, b.lng], { radius: tierOf(b.tier).radius, color: COLORS.ink, weight: 1, opacity: 0.4, dashArray: '2 4', fill: false, interactive: false }).addTo(layers.biz);
    }
  }
}

function drawMap(view) {
  layers.routes.clearLayers();
  layers.marks.clearLayers();
  layers.biz.clearLayers();
  layers.tech.clearLayers();
  if (walkerMarker) {
    walkerMarker.remove();
    walkerMarker = null;
  }
  const showUser = view !== 'caminar' && view !== 'llegada';
  if (showUser) userMarker.addTo(map); else userMarker.remove();

  if (view === 'rutas' && state.trip && !state.trip.error) {
    const trip = state.trip;
    if (!trip.same) drawRoute(trip.fast, 'fast', state.choice === 'fast');
    drawRoute(trip.safe, 'safe', state.choice === 'safe' || trip.same);
    drawEndpoints(state.plan.from, state.plan.to);
    const chosen = state.choice === 'fast' ? trip.fast : trip.safe;
    drawBusinesses(matchedBusinesses(chosen.coords), false);
    if (state.tech && state.showExplored) {
      for (const p of chosen.explored) L.circleMarker(p, { radius: 4, color: COLORS.ink, weight: 1, fillColor: COLORS.ink, fillOpacity: 0.35, interactive: false }).addTo(layers.tech);
    }
    fitTo(trip.safe.coords.concat(trip.fast.coords));
    return;
  }
  if (view === 'rutas' || view === 'planear') {
    drawEndpoints(state.plan.from, state.plan.to);
    const pts = [];
    if (state.plan.from) pts.push([state.plan.from.lat, state.plan.from.lng]);
    if (state.plan.to) pts.push([state.plan.to.lat, state.plan.to.lng]);
    if (pts.length === 2) fitTo(pts);
    return;
  }
  if (view === 'caminar' && state.nav) {
    const nav = state.nav;
    drawRoute(nav.route, nav.kind, true);
    L.marker([nav.to.lat, nav.to.lng], { icon: divIcon('m-b', 26), keyboard: false, title: 'Destino' }).addTo(layers.marks);
    drawBusinesses(nav.bizOnRoute, false);
    const pos = positionAt(nav.p);
    walkerMarker = L.marker(pos, { icon: divIcon('m-me', 20), keyboard: false, zIndexOffset: 1000 }).addTo(map);
    centerOn(pos, 17);
    return;
  }
  if (view === 'llegada' && state.lastTrip) {
    drawRoute({ coords: state.lastTrip.coords }, state.lastTrip.kind, true);
    L.marker([state.lastTrip.to.lat, state.lastTrip.to.lng], { icon: divIcon('m-b', 26), keyboard: false }).addTo(layers.marks);
    fitTo(state.lastTrip.coords);
    return;
  }
  if (view === 'reportar' && state.report) {
    L.marker([state.report.lat, state.report.lng], { icon: divIcon('m-pin', 22), keyboard: false, title: 'Lugar del reporte' }).addTo(layers.marks);
    L.circle([state.report.lat, state.report.lng], { radius: REPORT_RADIUS_M, color: COLORS.zone, weight: 2.5, opacity: 0.9, dashArray: '6 4', fillOpacity: 0.12, interactive: false }).addTo(layers.marks);
    centerOn([state.report.lat, state.report.lng], 17);
    return;
  }
  if (view === 'comercios') {
    drawBusinesses([], true);
    return;
  }
  if (view === 'comercio' && state.bizDraft && state.bizDraft.lat) {
    L.marker([state.bizDraft.lat, state.bizDraft.lng], { icon: divIcon('m-biz', 30, icon(categoryOf(state.bizDraft.category).icon)), keyboard: false }).addTo(layers.marks);

    centerOn([state.bizDraft.lat, state.bizDraft.lng], 17);

function onMapClick(e) {
  if (state.pick) return;
  const view = currentView();
  if (view !== 'inicio' && view !== 'planear') return;
  const lat = e.latlng.lat;
  const lng = e.latlng.lng;
  let html;
  if (!insideArea(lat, lng) && nearestNode(lat, lng).dist > OUT_OF_AREA_M) {
    html = '<span class="pop-t">Fuera de la zona de ejemplo</span>Por ahora GoIA cubre la colonia Cuauhtémoc.';
  } else {
    html = '<span class="pop-t">' + esc(nameAt(lat, lng)) + '</span>' +
      '<div class="pop-actions"><button class="btn small" type="button" data-pop="to">Ir aquí</button>' +
      '<button class="btn small secondary" type="button" data-pop="from">Salir desde aquí</button></div>';
  }
  const popup = L.popup({ closeButton: true, autoPanPaddingBottomRight: [20, isMobile() ? document.getElementById('panel').offsetHeight + 20 : 20] })
    .setLatLng(e.latlng).setContent(html).openOn(map);
  const el = popup.getElement();
  if (!el) return;
  el.addEventListener('click', function (ev) {
    const btn = ev.target.closest('[data-pop]');
    if (!btn) return;
    const place = { id: 'p:' + lat.toFixed(5) + ',' + lng.toFixed(5), name: nameAt(lat, lng), sub: 'Punto en el mapa', lat: lat, lng: lng, kind: 'point' };
    map.closePopup();
    if (btn.dataset.pop === 'to') {
      if (!state.plan.from) state.plan.from = USER_LOCATION;
      state.plan.to = place;
      go('rutas');
    } else {
      state.plan.from = place;
      state.plan.active = 'to';
      state.plan.query = '';
      go('planear');
    }
  });
}

function startPick(title, start, done) {
  state.pick = { done: done };
  document.body.classList.add('picking');
  document.getElementById('pick-title').textContent = title;
  document.getElementById('pick-pin').innerHTML = icon('pin');
  document.getElementById('pick-pin').hidden = false;

}

function updatePickLabel() {
  if (!state.pick) return;
  const c = map.getCenter();
  const label = document.getElementById('pick-place');
  const ok = document.getElementById('pick-ok');
  if (!insideArea(c.lat, c.lng) && nearestNode(c.lat, c.lng).dist > OUT_OF_AREA_M) {

function endPick(confirmed) {
  if (!state.pick) return;

function toast(message, actionLabel, action) {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  const span = document.createElement('span');
  span.textContent = message;
  el.appendChild(span);
  box.appendChild(el);
  if (!actionLabel) {
    setTimeout(function () { el.remove(); }, 4000);
    return;
  }
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = actionLabel;
  b.addEventListener('click', function () {
    action();
    el.remove();
  });
  el.appendChild(b);
  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'toast-close';
  close.setAttribute('aria-label', 'Cerrar aviso');
  close.innerHTML = icon('close');
  close.addEventListener('click', function () { el.remove(); });
  el.appendChild(close);
}

function confirmDialog(title, body, okLabel) {
  const dlg = document.getElementById('confirm');
  document.getElementById('confirm-t').textContent = title;
  document.getElementById('confirm-b').textContent = body;
  document.getElementById('confirm-yes').textContent = okLabel;
  return new Promise(function (resolve) {
    function finish(answer) {
      dlg.close();
      document.getElementById('confirm-yes').onclick = null;
      document.getElementById('confirm-no').onclick = null;
      dlg.oncancel = null;
      resolve(answer);
    }
    document.getElementById('confirm-yes').onclick = function () { finish(true); };
    document.getElementById('confirm-no').onclick = function () { finish(false); };
    dlg.oncancel = function () { finish(false); };
    dlg.showModal();
  });
}

const PARENTS = {
  inicio: null, planear: 'inicio', rutas: 'planear', caminar: 'rutas', llegada: 'inicio',
  reportar: 'inicio', 'reporte-enviado': 'inicio', reportes: 'menu', menu: 'inicio',
  comercios: 'menu', comercio: 'comercios'
};

function currentView() {
  const v = location.hash.replace('#', '');
  if (Object.prototype.hasOwnProperty.call(PARENTS, v)) return v;
  return 'inicio';
}

function go(view, replace) {
  if (currentView() === view && location.hash) {
    render();
    return;
  }
  if (replace) location.replace('#' + view); else location.hash = view;
}

function back() {
  const view = currentView();
  let parent = PARENTS[view] || 'inicio';
  if (view === 'reportar' && state.report) parent = state.report.returnTo;
  const s = state.stack;
  if (s.length > 1 && s[s.length - 2] === parent) history.back(); else go(parent, true);
}

function bar(title) {
  return '<div class="bar"><button class="icon-btn" type="button" data-action="back" aria-label="Volver">' + icon('back') + '</button>' +
    '<span class="bar-title">' + esc(title) + '</span></div>';
}

function row(opts) {
  const tag = opts.action ? 'button' : 'div';
  let attrs = opts.action ? ' type="button" data-action="' + opts.action + '"' : '';

  if (opts.role) attrs += ' role="' + opts.role + '" aria-checked="' + (opts.checked ? 'true' : 'false') + '"';
  const cls = 'row' + (opts.action ? '' : ' static');
  return '<li><' + tag + ' class="' + cls + '"' + attrs + '>' +
    '<span class="row-ico' + (opts.zone ? ' zone' : '') + '">' + icon(opts.icon) + '</span>' +

function buildNav(route, kind, to) {
  const coords = route.coords;
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + haversineMeters(coords[i - 1][0], coords[i - 1][1], coords[i][0], coords[i][1]));
  const steps = [];
  for (let i = 0; i < route.segStreets.length; i++) {
    if (i === 0 || route.segStreets[i] !== route.segStreets[i - 1]) {
      let turn = 'straight';
      if (i > 0) {
        const diff = bearing(coords[i], coords[i + 1]) - bearing(coords[i - 1], coords[i]);
        const d = ((diff + 540) % 360) - 180;
        if (d > 30) turn = 'right';
        if (d < -30) turn = 'left';
      }
      steps.push({ street: route.segStreets[i], start: cum[i], turn: turn });
    }
  }
  return {
    route: route, kind: kind, to: to, coords: coords, cum: cum, total: cum[cum.length - 1],
    steps: steps, p: 0, paused: false, timer: null, seenBiz: [], notice: null,
    bizOnRoute: matchedBusinesses(coords), rerouted: false
  };
}

function bearing(a, b) {
  const toRad = Math.PI / 180;
  const y = Math.sin((b[1] - a[1]) * toRad) * Math.cos(b[0] * toRad);
  const x = Math.cos(a[0] * toRad) * Math.sin(b[0] * toRad) - Math.sin(a[0] * toRad) * Math.cos(b[0] * toRad) * Math.cos((b[1] - a[1]) * toRad);
  return Math.atan2(y, x) * 180 / Math.PI;
}

function positionAt(p) {
  const nav = state.nav;
  const c = nav.coords;
  for (let i = 0; i < c.length - 1; i++) {
    if (p <= nav.cum[i + 1]) {
      const seg = nav.cum[i + 1] - nav.cum[i];
      const t = seg > 0 ? (p - nav.cum[i]) / seg : 0;
      return [c[i][0] + (c[i + 1][0] - c[i][0]) * t, c[i][1] + (c[i + 1][1] - c[i][1]) * t];
    }
  }
  return c[c.length - 1];
}

function navInstruction() {
  const nav = state.nav;
  let current = 0;
  for (let i = 0; i < nav.steps.length; i++) if (nav.steps[i].start <= nav.p) current = i;
  const next = nav.steps[current + 1];
  if (nav.p < 1) {
    return { icon: 'up', title: 'Camina por ' + nav.steps[0].street, dist: next ? 'por ' + formatDist(next.start) : formatDist(nav.total) + ' hasta tu destino' };
  }
  if (!next) {
    return { icon: 'flag', title: 'Llegas a ' + nav.to.name, dist: 'en ' + formatDist(nav.total - nav.p) };
  }
  let verb = 'Sigue derecho por ';
  let ic = 'up';
  if (next.turn === 'right') { verb = 'Gira a la derecha en '; ic = 'right'; }
  if (next.turn === 'left') { verb = 'Gira a la izquierda en '; ic = 'left'; }
  return { icon: ic, title: verb + next.street, dist: 'en ' + formatDist(next.start - nav.p) };
}

function tick() {
  const nav = state.nav;
  if (!nav || nav.paused) return;
  nav.p = Math.min(nav.total, nav.p + SIM_STEP_M);
  const pos = positionAt(nav.p);
  if (walkerMarker) walkerMarker.setLatLng(pos);
  keepVisible(pos);
  for (const item of nav.bizOnRoute) {
    const b = item.biz;
    if (nav.seenBiz.indexOf(b.id) === -1 && haversineMeters(pos[0], pos[1], b.lat, b.lng) <= tierOf(b.tier).radius) {
      nav.seenBiz.push(b.id);
      nav.notice = b;
      const box = document.getElementById('nav-notice');
      if (box) delete box.dataset.id;
    }
  }
  updateNavUI();
  if (nav.p >= nav.total) arrive();
}

function stopTimer() {
  if (state.nav && state.nav.timer) {
    clearInterval(state.nav.timer);
    state.nav.timer = null;
  }
}

function arrive() {
  const nav = state.nav;
  stopTimer();
  state.lastTrip = { to: nav.to, distM: nav.total, min: Math.max(1, Math.round(nav.total / WALK_M_PER_MIN)), coords: nav.coords, kind: nav.kind, last: positionAt(nav.total) };
  state.nav = null;
  go('llegada', true);
}

function sendReport() {
  const r = state.report;
  if (!r.type) {
    r.tried = true;
    render();
    const first = document.querySelector('[data-action="rtype"]');
    if (first) first.focus();
    return;
  }
  const saved = { id: 'rep-' + Date.now(), type: r.type, lat: r.lat, lng: r.lng, place: r.place, when: r.when, createdAt: Date.now() };
  reports.unshift(saved);
  storeSet('goia.reports', reports);
  rebuildZones();
  drawZones();
  let rerouted = false;
  if (r.returnTo === 'caminar' && state.nav) {
    const nav = state.nav;
    const here = positionAt(nav.p);
    const from = { lat: here[0], lng: here[1], name: nameAt(here[0], here[1]) };
    const fresh = runAStar(nav.kind === 'fast' ? 'fast' : 'safe', from, nav.to);
    if (fresh) {
      const restOld = nav.coords.slice(1);
      if (!sameCoords(fresh.coords.slice(1), restOld)) rerouted = true;
      const seen = nav.seenBiz;
      state.nav = buildNav(fresh, nav.kind, nav.to);
      state.nav.seenBiz = seen;
    }
  }
  state.lastReport = { report: saved, rerouted: rerouted, returnTo: r.returnTo };
  state.report = null;
  go('reporte-enviado', true);
}

function readBizForm() {
  const d = state.bizDraft;
  if (!d) return;

  if (!name) return;
  d.name = name.value.trim();
  d.category = document.getElementById('b-cat').value;
  d.promo = document.getElementById('b-promo').value.trim();
}

function render() {
  let view = currentView();
  const panel = document.getElementById('panel');

  if (view === 'rutas' && !(state.plan.from && state.plan.to)) view = redirect('planear');
  if (view === 'caminar' && !state.nav) view = redirect('inicio');
  if (view === 'llegada' && !state.lastTrip) view = redirect('inicio');
  if (view === 'reporte-enviado' && !state.lastReport) view = redirect('inicio');
  if (view === 'comercio' && !state.bizDraft) view = redirect('comercios');
  if (view === 'reportar' && !state.report) {
    state.report = { lat: USER_LOCATION.lat, lng: USER_LOCATION.lng, place: nameAt(USER_LOCATION.lat, USER_LOCATION.lng), type: null, when: 'ahora', returnTo: 'inicio', tried: false };
  }
  if (view !== 'caminar') stopTimer();
  if (view === 'rutas') {
    state.trip = computeTrip(state.plan.from, state.plan.to);
    if (state.trip.same) state.choice = 'safe';
  }

  const s = state.stack;
  if (s.length > 1 && s[s.length - 2] === view) s.pop(); else if (s[s.length - 1] !== view) s.push(view);

  let html = '';
  if (view === 'inicio') html = viewHome();
  else if (view === 'planear') html = viewPlan();
  else if (view === 'rutas') html = viewRoutes();
  else if (view === 'caminar') html = viewNav();
  else if (view === 'llegada') html = viewArrive();
  else if (view === 'reportar') html = viewReport();
  else if (view === 'reporte-enviado') html = viewReportSent();
  else if (view === 'reportes') html = viewReports();
  else if (view === 'menu') html = viewMenu();
  else if (view === 'comercios') html = viewBusinesses();
  else if (view === 'comercio') html = viewBusinessEdit();

  const sameView = panel.dataset.view === view;
  const scroll = panel.scrollTop;
  panel.innerHTML = html;
  panel.dataset.view = view;
  applyRoving(panel);
  document.body.classList.toggle('walking', view === 'caminar');
  document.getElementById('nav-banner').hidden = view !== 'caminar';
  document.title = view === 'inicio' ? 'GoIA' : 'GoIA · ' + (panel.querySelector('h1') ? panel.querySelector('h1').textContent.replace(/\.$/, '') : '');

  if (view === 'planear') {
    renderPlanResults();
    bindPlanInputs();
  }
  if (view === 'caminar') {
    updateNavUI();
    if (!state.nav.timer && !state.nav.paused) state.nav.timer = setInterval(tick, SIM_TICK_MS);
  }

  if (sameView) {
    panel.scrollTop = scroll;
  } else {
    panel.scrollTop = 0;
    const h = panel.querySelector('h1');
    if (h && view !== 'planear') h.focus({ preventScroll: true });
  }
  requestAnimationFrame(function () {
    map.invalidateSize();
    drawMap(view);
  });
}

function redirect(view) {
  history.replaceState(null, '', '#' + view);
  return view;
}

function bindPlanInputs() {
  const p = state.plan;
  const inputs = { from: document.getElementById('in-from'), to: document.getElementById('in-to') };
  for (const key of ['from', 'to']) {
    const input = inputs[key];
    input.addEventListener('focus', function () {
      if (p.active !== key) {
        p.active = key;
        p.query = '';
      }
      input.select();
      renderPlanResults();
    });
    input.addEventListener('input', function () {
      p.active = key;
      p.query = input.value;
      p[key] = null;
      renderPlanResults();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && state.planList && state.planList.length && p.query.trim()) {
        e.preventDefault();
        choosePlace(state.planList[0]);
      }
      if (e.key === 'ArrowDown') {
        const first = document.querySelector('#plan-results .row');
        if (first) {
          e.preventDefault();
          first.focus();
        }
      }
    });
  }
  const target = inputs[p.active];
  target.focus({ preventScroll: true });
  if (p.query) {
    target.value = p.query;
  }
}

document.getElementById('panel').addEventListener('click', async function (e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === 'back') back();
  else if (action === 'menu') go('menu');
  else if (action === 'home') go('inicio');
  else if (action === 'search') {
    state.plan = { from: state.plan.from || USER_LOCATION, to: null, active: 'to', query: '' };
    go('planear');
  } else if (action === 'recent') {
    state.plan = { from: USER_LOCATION, to: recents[Number(id)], active: 'to', query: '' };
    go('rutas');
  } else if (action === 'landmark') {
    const place = buildPlaces()[Number(id)];
    addRecent(place);
    state.plan = { from: USER_LOCATION, to: place, active: 'to', query: '' };
    go('rutas');
  } else if (action === 'place') {
    if (id === 'me') choosePlace(USER_LOCATION);
    else choosePlace(state.planList[Number(id)]);
  } else if (action === 'pick-plan') {
    const key = state.plan.active;
    startPick(key === 'from' ? 'Elige tu punto de salida' : 'Elige tu destino', AREA.center, function (place) {
      state.plan[key] = place;
      state.plan.query = '';
      if (key === 'to') addRecent(place);
      if (state.plan.from && state.plan.to) go('rutas');
      else {
        state.plan.active = state.plan.from ? 'to' : 'from';
        render();
      }
    });
  } else if (action === 'swap') {
    const p = state.plan;
    const tmp = p.from;
    p.from = p.to;
    p.to = tmp;
    p.query = '';
    if (p.from && p.to) go('rutas'); else render();
  } else if (action === 'edit-plan') {
    state.plan.active = 'to';
    state.plan.query = '';
    go('planear');
  } else if (action === 'choose') {
    selectRoute(id);
  } else if (action === 'start') {
    const trip = state.trip;
    const route = state.choice === 'fast' ? trip.fast : trip.safe;
    state.nav = buildNav(route, trip.same ? 'safe' : state.choice, state.plan.to);
    go('caminar');
  } else if (action === 'pause') {
    const nav = state.nav;
    nav.paused = !nav.paused;
    if (!nav.paused && !nav.timer) nav.timer = setInterval(tick, SIM_TICK_MS);
    updateNavUI();
  } else if (action === 'end-nav') {
    const nav = state.nav;
    const wasPaused = nav.paused;
    nav.paused = true;
    const ok = await confirmDialog('¿Terminar la caminata?', 'Dejarás de recibir indicaciones para llegar a ' + nav.to.name + '.', 'Terminar');
    if (ok) {
      stopTimer();
      state.nav = null;
      go('inicio');
    } else {
      nav.paused = wasPaused;
      updateNavUI();
    }
  } else if (action === 'report-nav') {
    const pos = positionAt(state.nav.p);
    openReport({ lat: pos[0], lng: pos[1] }, 'caminar');
  } else if (action === 'report-arrive') {
    openReport({ lat: state.lastTrip.last[0], lng: state.lastTrip.last[1] }, 'llegada');
  } else if (action === 'report-here') {
    openReport({ lat: USER_LOCATION.lat, lng: USER_LOCATION.lng }, currentView());
  } else if (action === 'rtype') {
    state.report.type = id;
    render();
    const again = document.querySelector('[data-action="rtype"][data-id="' + id + '"]');
    if (again) again.focus();
  } else if (action === 'rwhen') {
    state.report.when = id;
    render();
    const again = document.querySelector('[data-action="rwhen"][data-id="' + id + '"]');
    if (again) again.focus();
  } else if (action === 'report-pick') {
    const r = state.report;
    startPick('¿Dónde lo viste?', [r.lat, r.lng], function (place) {
      r.lat = place.lat;
      r.lng = place.lng;
      r.place = place.name;
      render();
    });
  } else if (action === 'send-report') {
    sendReport();
  } else if (action === 'resume') {
    go('caminar', true);
  } else if (action === 'go-reports') {
    go('reportes');
  } else if (action === 'focus-report') {
    for (const r of reports) {
      if (r.id === id) centerOn([r.lat, r.lng], 17);
    }
  } else if (action === 'delete-report') {
    let removed = null;
    let at = 0;
    for (let i = 0; i < reports.length; i++) {
      if (reports[i].id === id) {
        removed = reports[i];
        at = i;
      }
    }
    if (!removed) return;
    reports.splice(at, 1);
    storeSet('goia.reports', reports);
    rebuildZones();
    drawZones();
    render();
    toast('Reporte borrado.', 'Deshacer', function () {
      reports.splice(at, 0, removed);
      storeSet('goia.reports', reports);
      rebuildZones();
      drawZones();
      render();
    });
  } else if (action === 'tech') {
    state.tech = !state.tech;
    storeSet('goia.tech', state.tech);
    render();
  } else if (action === 'explored') {
    state.showExplored = !state.showExplored;
    state.techOpen = true;
    render();
  } else if (action === 'reset') {
    const ok = await confirmDialog('¿Restablecer los datos de ejemplo?', 'Se borrarán tus reportes, tus destinos recientes y los cambios a comercios.', 'Restablecer');
    if (!ok) return;
    reports = [];
    recents = [];
    businesses = SAMPLE_BUSINESSES.map(function (b) { return Object.assign({}, b); });
    storeSet('goia.reports', reports);
    storeSet('goia.recents', recents);
    storeSet('goia.businesses', businesses);
    rebuildZones();
    drawZones();
    render();
    toast('Datos de ejemplo restablecidos.');
  } else if (action === 'go-business') {
    go('comercios');
  } else if (action === 'edit-biz') {
    const b = businesses[Number(id)];
    state.bizDraft = Object.assign({ index: Number(id), tried: false }, b);
    go('comercio');
  } else if (action === 'new-biz') {
    state.bizDraft = { index: null, name: '', category: 'cafe', tier: 'basic', promo: '', lat: null, lng: null, tried: false };
    go('comercio');
  } else if (action === 'btier') {
    readBizForm();
    state.bizDraft.tier = id;
    render();
  } else if (action === 'biz-pick') {
    readBizForm();
    const d = state.bizDraft;
    startPick('¿Dónde está el comercio?', d.lat ? [d.lat, d.lng] : AREA.center, function (place) {
      d.lat = place.lat;
      d.lng = place.lng;
      render();
    });
  } else if (action === 'save-biz') {
    readBizForm();
    const d = state.bizDraft;
    if (!d.name || !d.lat) {
      d.tried = true;
      render();
      return;
    }
    const clean = { id: d.id || 'biz-' + Date.now(), name: d.name, category: d.category, tier: d.tier, promo: d.promo || 'Visítanos en tu camino', lat: d.lat, lng: d.lng };
    if (d.index === null) businesses.push(clean); else businesses[d.index] = clean;
    storeSet('goia.businesses', businesses);
    state.bizDraft = null;
    toast('Comercio guardado.');
    back();
  } else if (action === 'delete-biz') {
    const d = state.bizDraft;
    const ok = await confirmDialog('¿Quitar ' + (d.name || 'este comercio') + '?', 'Dejará de aparecer en las rutas.', 'Quitar');
    if (!ok) return;
    businesses.splice(d.index, 1);
    storeSet('goia.businesses', businesses);
    state.bizDraft = null;
    toast('Comercio quitado.');
    back();
  }
});

function applyRoving(root) {
  for (const group of root.querySelectorAll('[role="radiogroup"]')) {
    const items = group.querySelectorAll('[role="radio"]');
    let checked = null;
    for (const item of items) {
      item.tabIndex = -1;
      if (item.getAttribute('aria-checked') === 'true') checked = item;
    }
    if (checked) checked.tabIndex = 0;
    else if (items.length) items[0].tabIndex = 0;
  }
}

document.getElementById('panel').addEventListener('keydown', function (e) {
  const forward = e.key === 'ArrowDown' || e.key === 'ArrowRight';
  const backward = e.key === 'ArrowUp' || e.key === 'ArrowLeft';
  if (!forward && !backward) return;

  const radio = e.target.closest('[role="radio"]');
  if (radio) {
    e.preventDefault();
    const items = Array.from(radio.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]'));
    let i = items.indexOf(radio);
    i = forward ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
    const action = items[i].dataset.action;
    const id = items[i].dataset.id;
    items[i].click();
    const again = document.querySelector('[data-action="' + action + '"][data-id="' + id + '"]');
    if (again) again.focus();
    return;
  }

  const result = e.target.closest('#plan-results .row');
  if (result && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const rows = Array.from(document.querySelectorAll('#plan-results .row'));
    const i = rows.indexOf(result);
    if (e.key === 'ArrowDown' && i < rows.length - 1) rows[i + 1].focus();
    if (e.key === 'ArrowUp') {
      if (i > 0) rows[i - 1].focus();
      else document.getElementById(state.plan.active === 'from' ? 'in-from' : 'in-to').focus();
    }
  }
});

document.getElementById('panel').addEventListener('toggle', function (e) {
  if (e.target.matches && e.target.matches('details.tech')) state.techOpen = e.target.open;
}, true);

document.getElementById('pick-ok').addEventListener('click', function () { endPick(true); });
document.getElementById('pick-cancel').addEventListener('click', function () { endPick(false); });

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('confirm').open) return;
  if (state.pick) {
    endPick(false);
    return;
  }
  if (map && map.closePopup) map.closePopup();
  const view = currentView();
  if (view !== 'inicio' && view !== 'caminar' && !(e.target && e.target.tagName === 'TEXTAREA')) back();
});

window.addEventListener('hashchange', function () {
  if (state.pick) endPick(false);
  render();
});

rebuildZones();
readColors();
initMap();
drawZones();
render();
</script>
</body>
